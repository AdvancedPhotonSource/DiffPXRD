name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements-cpu.txt '.[test,reproduce]'
      - run: python -m pytest -q
      - run: python examples/simulate.py --output-dir outputs/simulate
      - run: python examples/refine.py --output-dir outputs/refine
      - run: python examples/fit_series.py --output-dir outputs/series
